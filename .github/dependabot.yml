version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The CI images pin their bases by digest, so a base-image CVE is only picked up when
  # something bumps the digest. Dependabot is that something.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
