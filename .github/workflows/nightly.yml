name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      new: ${{ steps.check.outputs.new }}
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check for new commits since the last nightly
        id: check
        run: |
          LAST=$(git tag -l 'v*-nightly.*' | sort -V | tail -1)
          if [ -z "$LAST" ] || ! git merge-base --is-ancestor HEAD "$LAST" 2>/dev/null; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pin nightly tag and commit
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(jq -r '.version' package.json)
          echo "tag=v${VERSION}-nightly.${DATE}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-assets:
    name: build and publish nightly release
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.check.outputs.tag }}
      sha: ${{ needs.check.outputs.sha }}
      make_latest: false

  prune:
    name: prune old nightly releases
    needs: release-assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Keep the latest seven nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | .[7:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --yes 2>/dev/null || true
              git push origin --delete "$tag" 2>/dev/null || true
            done

  live-e2e:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install and generate
        run: |
          bun install --frozen-lockfile
          bun run generate
      - name: Live model e2e
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MONAD_LIVE_MODEL: ${{ vars.MONAD_LIVE_MODEL }}
        run: >-
          bun test
          apps/monad/test/e2e/live-model.test.ts
          apps/monad/test/e2e/live-approvals.test.ts
          apps/monad/test/e2e/live-hooks.test.ts
          apps/monad/test/e2e/live-scenarios.test.ts
          apps/monad/test/e2e/live-resilience.test.ts
