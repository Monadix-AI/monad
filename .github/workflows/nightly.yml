name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    outputs:
      new: ${{ steps.check.outputs.new }}
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check for new commits since the last nightly
        id: check
        run: |
          LAST=$(git tag -l 'v*-nightly.*' | sort -V | tail -1)
          if [ -z "$LAST" ] || ! git merge-base --is-ancestor HEAD "$LAST" 2>/dev/null; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pin nightly tag and commit
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(jq -r '.version' package.json)
          echo "tag=v${VERSION}-nightly.${DATE}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: unit and integration validation
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      nightly: true
      sha: ${{ needs.check.outputs.sha }}

  release-assets:
    name: build and publish nightly release
    needs: [check, quality]
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/release.yml
    # release.yml's publish job declares attestations/id-token write. A called workflow cannot
    # escalate past what the caller grants, so anything narrower than this fails the whole run at
    # creation time with startup_failure — before a single job is scheduled.
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets: inherit
    with:
      tag: ${{ needs.check.outputs.tag }}
      sha: ${{ needs.check.outputs.sha }}
      make_latest: false
      generate_notes: true

  prune:
    name: prune old nightly releases
    needs: release-assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Keep the latest seven nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | .[7:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --yes 2>/dev/null || true
              git push origin --delete "$tag" 2>/dev/null || true
            done
