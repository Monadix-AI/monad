name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    outputs:
      new: ${{ steps.check.outputs.new }}
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check for new commits since the last nightly
        id: check
        run: |
          LAST=$(git tag -l 'v*-nightly.*' | sort -V | tail -1)
          if [ -z "$LAST" ] || ! git merge-base --is-ancestor HEAD "$LAST" 2>/dev/null; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pin nightly tag and commit
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(jq -r '.version' package.json)
          echo "tag=v${VERSION}-nightly.${DATE}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-assets:
    name: build and publish nightly release
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/release.yml
    # release.yml's publish job declares attestations/id-token write. A called workflow cannot
    # escalate past what the caller grants, so anything narrower than this fails the whole run at
    # creation time with startup_failure — before a single job is scheduled.
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets: inherit
    with:
      tag: ${{ needs.check.outputs.tag }}
      sha: ${{ needs.check.outputs.sha }}
      make_latest: false

  installer-arm64:
    name: installer smoke test (windows-arm64)
    needs: [check, release-assets]
    if: needs.check.outputs.new == 'true' && needs.release-assets.result == 'success'
    runs-on: windows-11-arm
    timeout-minutes: 10
    env:
      MONAD_DIST_VERSION: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: artifacts
      - name: Test PowerShell installer
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8123','--directory','artifacts' -WindowStyle Hidden
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            try { Invoke-WebRequest http://127.0.0.1:8123/ -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 250 }
          }
          $env:MONAD_DOWNLOAD_URL = 'http://127.0.0.1:8123'
          $env:MONAD_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'monad-install'
          $env:MONAD_NO_MODIFY_PATH = '1'
          $env:MONAD_NO_OPEN = '1'
          $env:MONAD_FORCE_INTERACTIVE = '1'
          & artifacts/install.ps1 *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'install.log')
          Select-String -SimpleMatch '◆ MONAD' (Join-Path $env:RUNNER_TEMP 'install.log') | Out-Null
          Select-String -SimpleMatch 'Checksum verified' (Join-Path $env:RUNNER_TEMP 'install.log') | Out-Null
          if (Select-String -SimpleMatch 'no checksums to verify' (Join-Path $env:RUNNER_TEMP 'install.log')) {
            throw 'installer did not verify the archive checksum'
          }
          if (!(Test-Path (Join-Path $env:MONAD_INSTALL_DIR 'monad.exe'))) { throw 'monad.exe was not installed' }
          # -SimpleMatch, and build metadata stripped: a nightly tag is v0.1.7-nightly.20260814+abc1234,
          # so the default regex interpretation would read the `+` as a quantifier and never match.
          $expected = ($env:MONAD_DIST_VERSION -replace '^v','') -replace '\+.*$',''
          $reported = & (Join-Path $env:MONAD_INSTALL_DIR 'monad.exe') --version
          if (!($reported | Select-String -SimpleMatch $expected)) {
            throw "installed binary reported '$reported', expected it to contain '$expected'"
          }

  prune:
    name: prune old nightly releases
    needs: release-assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Keep the latest seven nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | .[7:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --yes 2>/dev/null || true
              git push origin --delete "$tag" 2>/dev/null || true
            done

  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install and generate
        run: |
          bun install --frozen-lockfile
          bun run generate
      - name: Live model e2e
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MONAD_LIVE_MODEL: ${{ vars.MONAD_LIVE_MODEL }}
        run: >-
          bun test
          apps/monad/test/e2e/live-model.test.ts
          apps/monad/test/e2e/live-approvals.test.ts
          apps/monad/test/e2e/live-hooks.test.ts
          apps/monad/test/e2e/live-scenarios.test.ts
          apps/monad/test/e2e/live-resilience.test.ts
