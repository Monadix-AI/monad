name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run the full merge-queue quality gate.
        required: false
        type: boolean
        default: false
      force:
        description: Execute every Turbo task instead of restoring task results from cache.
        required: false
        type: boolean
        default: false
      sha:
        description: Commit to validate. Defaults to the triggering commit.
        required: false
        type: string
      release_validation:
        description: Called by release.yml, which runs the real installer and upgrade jobs itself.
        required: false
        type: boolean
        default: false
  # Runs the cross-platform matrix on demand. Without it the only ways to exercise the macOS and
  # Windows legs are entering the merge queue or dispatching a real release, which publishes assets.
  workflow_dispatch:
    inputs:
      full:
        description: Run the full cross-platform quality gate.
        required: false
        type: boolean
        default: true
      force:
        description: Execute every Turbo task instead of restoring task results from cache.
        required: false
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # turbo.jsonc sets ui:"tui"; force the stream renderer in non-interactive CI.
  TURBO_UI: "false"
  # Optional Turbo remote cache. Set TURBO_TOKEN (Actions secret, repo-scoped) and
  # TURBO_TEAM (Actions variable) to share the build cache across runs and runners.
  # Both default to empty strings when unset — Turbo silently falls back to the
  # local cache, so CI is fully functional without them.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # PR and merge-queue validation reuse deterministic task results. The final release gate opts out
  # explicitly, while dependency/tool caches remain available to avoid repeated downloads.
  TURBO_FORCE: ${{ inputs.force && 'true' || 'false' }}
  # Defender real-time protection scans every file Bun writes, and the dependency cache holds
  # ~500 MB across hundreds of thousands of small files. Excluding the workspace is the single
  # largest Windows win. TEMP is separate from RUNNER_TEMP and matters just as much: the suites
  # build their homes under os.tmpdir(), and a scanner holding a handle there surfaces as EBUSY
  # on rm and ENOENT on rename rather than as slowness. A composite action cannot carry this: it
  # has to run before checkout, so the script is shared through this variable instead. Exclusions
  # need admin rights the hosted runner has but a self-hosted one may not, so a failure here must
  # not fail the job.
  WINDOWS_DEFENDER_EXCLUSIONS: |
    foreach ($path in @($env:GITHUB_WORKSPACE, "$env:RUNNER_TEMP", "$env:TEMP", "$env:TMP", "$env:USERPROFILE\.bun")) {
      try { Add-MpPreference -ExclusionPath $path -ErrorAction Stop }
      catch { Write-Host "::warning::Defender path exclusion failed for $path" }
    }
    foreach ($process in @('bun.exe', 'tar.exe', 'zstd.exe', 'node.exe')) {
      try { Add-MpPreference -ExclusionProcess $process -ErrorAction Stop }
      catch { Write-Host "::warning::Defender process exclusion failed for $process" }
    }
  # The hosted Windows image puts the workspace and RUNNER_TEMP on D: but leaves the user's TEMP on
  # C:, whose IOPS are roughly an order of magnitude worse — and the suites build every throwaway
  # home under os.tmpdir(). libuv reads TMP before TEMP, so both have to move. Deriving the target
  # from RUNNER_TEMP rather than hardcoding D: keeps this correct on larger runners, which have no
  # D: drive at all.
  WINDOWS_FAST_TEMP: |
    $fast = Join-Path $env:RUNNER_TEMP 'tmp'
    New-Item -ItemType Directory -Force -Path $fast | Out-Null
    "TMP=$fast" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    "TEMP=$fast" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

jobs:
  # OS-independent checks — typecheck, lint, knip in one job to share bun install.
  checks:
    name: checks
    # OS-independent (lint, typecheck, knip, generated-artifact drift). Linux runners bill at 1x;
    # macOS at 10x. The OS-sensitive work is covered by the unit/e2e matrices below.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.6.11
          install: true
          cache: true
      - name: Keep the Bun cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-install-cache" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run agents:sync
      - run: mise run --continue-on-error quality:check
      - run: git diff --exit-code

      # Saves even when the job fails: a red Windows job used to skip the post step, so the next
      # run paid a cold install again — the slowness kept itself alive.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  # Pull requests get the Linux leg as a low-cost feedback loop. Merge queue candidates get the
  # full cross-platform matrix before they are allowed onto main.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The Windows leg hangs intermittently in apps/monad/test/unit/sessions: the same commit has
    # both passed in 3 minutes and stalled with no output. Until that is found it reports without
    # blocking. The deadline it trips is on the step below, because a job-level timeout cancels
    # rather than fails, and continue-on-error absorbs a failure but not a cancellation.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'merge_group' || inputs.full) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      # Runs before checkout so the dependency-cache extraction and install are covered too.
      - name: Exclude the workspace from Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ env.WINDOWS_DEFENDER_EXCLUSIONS }}

      - name: Put temporary files on the fast volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ env.WINDOWS_FAST_TEMP }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Keep the Bun cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-install-cache" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test workspace unit
        # Ten minutes is triple the healthy cross-platform run and turns the hang into a reported
        # failure instead of a job the release waits half an hour for.
        timeout-minutes: 10
        env:
          MONAD_TEST_COVERAGE: ${{ runner.os == 'Linux' && '1' || '0' }}
          MONAD_TEST_JUNIT_DIR: ${{ runner.temp }}/monad-junit
        run: bun scripts/quiet-run.ts bunx --bun turbo run test --output-logs=errors-only

      - name: Test script unit
        if: ${{ !cancelled() }}
        run: bun scripts/bun-test.ts scripts/test/unit/ --only-failures

      - name: Upload test timings
        if: always()
        # Timing data is diagnostic; the artifact service being unreachable must not fail a suite
        # that already reported its own result.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-unit-${{ matrix.os }}
          path: ${{ runner.temp }}/monad-junit
          if-no-files-found: ignore
          retention-days: 7

      - name: Report coverage
        if: runner.os == 'Linux' && !cancelled()
        run: bun scripts/coverage-summary.ts

      - name: Upload coverage
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          # Bun resolves the lcov reporter against the bunfig root, so workspace suites run
          # through Turbo all land in the repo-root `coverage/`.
          path: |
            coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          # Turbo replays cached suites without running them, and a replayed run writes no lcov.
          # Absent coverage there means the tests were already green, not that reporting broke.
          if-no-files-found: ignore

      # Saves even when the job fails: a red Windows job used to skip the post step, so the next
      # run paid a cold install again — the slowness kept itself alive.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  # Hermetic daemon E2E uses real HTTP/SSE/stdio transports and local subprocess fixtures, but
  # excludes live providers, host-installed provider sessions, and dependency-container tests
  # before Bun loads those files.
  hermetic-e2e:
    name: hermetic e2e (${{ matrix.os }})
    if: github.event_name == 'merge_group' || inputs.full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Exclude the workspace from Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ env.WINDOWS_DEFENDER_EXCLUSIONS }}

      - name: Put temporary files on the fast volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ env.WINDOWS_FAST_TEMP }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Keep the Bun cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-install-cache" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sandbox launcher (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O2 -s -static \
            -o "$(dirname "$(which bun)")/monad-sandbox-launcher" \
            apps/monad/native/sandbox-launcher/main.c

      # apt stalled 34.5 minutes on azure.archive.ubuntu.com here and burned the job timeout, the
      # same mirror that hung the browser install. Bound each attempt rather than hand this leg's
      # deadline to a mirror.
      - name: Install MinGW (Windows sandbox launcher cross-compile)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
              install -y --no-install-recommends gcc-mingw-w64-x86-64 && exit 0
            echo "::warning::apt attempt ${attempt} did not finish within its deadline"
          done
          exit 1

      - name: Build Windows sandbox launchers (Low IL + AppContainer, x64 spike)
        if: runner.os == 'Linux'
        run: |
          BUN_DIR="$(dirname "$(which bun)")"
          # Low Integrity launcher — baseline, known-good
          x86_64-w64-mingw32-gcc -O2 -s -static -municode \
            -o "${BUN_DIR}/monad-sandbox-launcher.exe" \
            apps/monad/native/sandbox-launcher/windows.c \
            -ladvapi32
          echo "✓ Low IL launcher compiled"
          # AppContainer launcher — validates MinGW header availability for PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES
          x86_64-w64-mingw32-gcc -O2 -s -static -municode \
            -o "${BUN_DIR}/monad-sandbox-appcontainer.exe" \
            apps/monad/native/sandbox-launcher/windows-appcontainer.c \
            -ladvapi32 -luserenv
          echo "✓ AppContainer launcher compiled"

      - name: Test hermetic daemon E2E
        env:
          MONAD_TEST_JUNIT_DIR: ${{ runner.temp }}/monad-junit
        run: bunx --bun turbo run test:e2e --filter=@monad/monad --output-logs=errors-only

      # Per-case timings for finding where a slow leg spends its time; ignore when turbo replayed
      # cached results and no tests actually ran.
      - name: Upload test timings
        if: always()
        # Timing data is diagnostic; the artifact service being unreachable must not fail a suite
        # that already reported its own result.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-hermetic-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/monad-junit
          if-no-files-found: ignore
          retention-days: 7

      # Saves even when the job fails: a red Windows job used to skip the post step, so the next
      # run paid a cold install again — the slowness kept itself alive.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  # Browser E2E for the web UI. The specs stub daemon responses with Playwright request routing and
  # Playwright starts its own Vite server, so this job needs no daemon and no provider credentials.
  web-e2e:
    name: web e2e (${{ matrix.shard }}/2)
    if: github.event_name == 'merge_group' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's webServer wait times out intermittently on these runners with no server output,
    # one shard passing while its twin fails in the same run. Until that is found the leg reports
    # without blocking a release. Deliberate coverage loss: a real browser regression stops failing
    # the gate, so read this leg before shipping anything that touches apps/web.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Each shard pays a checkout, a bun install, and a Playwright browser install before it
        # runs 2-3 minutes of specs, and every shard is a concurrency slot. Under a saturated
        # runner pool a fourth shard has queued 21 minutes while the other three ran, so fewer
        # and slightly longer shards finish the leg sooner.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Keep the Bun cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-install-cache" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Browser binaries are ~150 MB and pinned by the @playwright/test version. Keying them on the
      # whole lockfile threw the payload away on every unrelated dependency bump, so both shards
      # re-downloaded it; key on the resolved Playwright version, which is what the payload tracks.
      - name: Resolve the Playwright version
        id: playwright-version
        shell: bash
        working-directory: apps/web
        run: |
          version="$(bun --print 'require("@playwright/test/package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # --with-deps runs apt, which stalled 23 minutes on azure.archive.ubuntu.com and burned the
      # job timeout after the browser itself had downloaded in a minute. The runner image already
      # ships those libraries, so bound the apt path and fall back to the browser-only install
      # rather than letting a third-party mirror decide whether this leg finishes.
      - name: Install Playwright browser
        run: timeout 300 bun playwright install --with-deps chromium || bun playwright install chromium
        working-directory: apps/web

      - name: Test web E2E
        # Deadline on the step, not the job: a job-level timeout cancels, and continue-on-error
        # absorbs a failure but not a cancellation.
        timeout-minutes: 20
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/2
        run: bunx --bun turbo run test:e2e --filter=@monad/web --output-logs=errors-only

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

      # Saves even when the job fails: a red Windows job used to skip the post step, so the next
      # run paid a cold install again — the slowness kept itself alive.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  # Cover installer and self-upgrade behavior before main. The explicit input keeps pull requests
  # and future merge queues gated while avoiding duplicate artifact builds inside release.yml.
  dist-tail:
    name: installer and upgrade e2e
    if: ${{ !inputs.release_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in step with release.yml's DIST_VERSION; release-dist-workflow.test.ts pins them equal.
      DIST_VERSION: "0.32.0"
      DIST_INSTALLER_SHA256: "b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5"
      OLD_TAG: v0.0.1
      NEW_TAG: v0.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Keep the Bun cache on the workspace volume
        shell: bash
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-install-cache" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install dist
        run: bun scripts/install-cargo-dist.ts "$DIST_VERSION" "$DIST_INSTALLER_SHA256"

      # Both sides are built here rather than downloaded, so this job stands alone and does not need
      # the release matrix to have run first.
      - name: Build the outgoing installation
        env:
          MONAD_DIST_VERSION: 0.0.1
        run: |
          dist build --artifacts=local --target=x86_64-unknown-linux-gnu --tag="${OLD_TAG}" --force-tag --output-format=json > old-local-dist-manifest.json
          cp old-local-dist-manifest.json target/distrib/x86_64-unknown-linux-gnu-dist-manifest.json
          dist build --artifacts=global --tag="${OLD_TAG}" --force-tag --output-format=json > old-global-dist-manifest.json
          bun scripts/enhance-dist-installers.ts
          mkdir -p artifacts/old
          find target/distrib -maxdepth 1 -type f -exec cp {} artifacts/old/ \;

      - name: Build the incoming installation
        env:
          MONAD_DIST_VERSION: 0.0.2
        run: |
          rm -rf target/distrib
          dist build --artifacts=local --target=x86_64-unknown-linux-gnu --tag="${NEW_TAG}" --force-tag --output-format=json > new-local-dist-manifest.json
          cp new-local-dist-manifest.json target/distrib/x86_64-unknown-linux-gnu-dist-manifest.json
          dist build --artifacts=global --tag="${NEW_TAG}" --force-tag --output-format=json > new-global-dist-manifest.json
          bun scripts/enhance-dist-installers.ts
          mkdir -p artifacts/new
          find target/distrib -maxdepth 1 -type f -exec cp {} artifacts/new/ \;

      # The same shell-installer assertions release.yml's install-test makes, so a broken installer
      # is caught before the commit reaches main rather than during the release.
      - name: Test shell installer
        env:
          MONAD_DIST_VERSION: ${{ env.NEW_TAG }}
        run: |
          python3 -m http.server 8123 --directory artifacts/new >"${RUNNER_TEMP}/monad-dist-http.log" 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8123/ >/dev/null && break; sleep 0.25; done
          export MONAD_DOWNLOAD_URL=http://127.0.0.1:8123
          export MONAD_INSTALL_DIR="${RUNNER_TEMP}/monad-install"
          export MONAD_NO_MODIFY_PATH=1
          export MONAD_NO_OPEN=1
          export MONAD_FORCE_INTERACTIVE=1
          script -qefc "sh artifacts/new/install.sh" "${RUNNER_TEMP}/install.log"
          cat "${RUNNER_TEMP}/install.log"
          grep -F "Checksum verified" "${RUNNER_TEMP}/install.log"
          ! grep -F "no checksums to verify" "${RUNNER_TEMP}/install.log"
          test -x "${MONAD_INSTALL_DIR}/monad"
          "${MONAD_INSTALL_DIR}/monad" --version | grep -F "${NEW_TAG#v}"

      - name: Upgrade an active daemon through CLI and Web
        run: |
          bun scripts/test/upgrade-dist-e2e.ts \
            --old-dir artifacts/old \
            --new-dir artifacts/new \
            --tag "${NEW_TAG}" \
            --channel stable

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  # Real third-party dependency tests. The normal e2e suite uses mocks/local fixtures; tests that need
  # provider CLIs or host archive binaries run inside a cached container image with those dependencies
  # preinstalled.
  e2e-deps:
    name: e2e deps container
    if: github.event_name == 'merge_group' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.e2e-deps
          target: test
          cache-from: type=gha,scope=e2e-deps
          cache-to: type=gha,scope=e2e-deps,mode=max

  gate:
    name: merge gate
    if: always()
    needs: [checks, unit, hermetic-e2e, web-e2e, dist-tail, e2e-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          FULL_CI: ${{ github.event_name == 'merge_group' || inputs.full }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          HERMETIC_E2E_RESULT: ${{ needs.hermetic-e2e.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          DIST_TAIL_RESULT: ${{ needs.dist-tail.result }}
          E2E_DEPS_RESULT: ${{ needs.e2e-deps.result }}
          RELEASE_VALIDATION: ${{ inputs.release_validation }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$UNIT_RESULT" = success

          if [[ "$FULL_CI" == true ]]; then
            test "$HERMETIC_E2E_RESULT" = success
            test "$WEB_E2E_RESULT" = success
            test "$E2E_DEPS_RESULT" = success
          fi

          # dist-tail is skipped only during a release validation, where release.yml runs the real
          # installer and upgrade jobs instead. Everywhere else it is required.
          if [[ "$RELEASE_VALIDATION" != true ]]; then
            test "$DIST_TAIL_RESULT" = success
          fi
