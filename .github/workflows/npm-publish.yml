name: npm publish

# Manual only. The npm packages (@monad/protocol, @monad/sdk-atom, @monad/sdk-experience) are
# not published yet, so nothing should reach the registry as a side effect of cutting a GitHub
# release. Run this with dry_run to exercise the build and the generated manifests.
#
# Before the first real publish: confirm the @monad scope is owned by this project (a dry run
# never contacts the registry for permission), and publish a prerelease version first — an npm
# version is immutable, and a burned version number cannot be reused.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the Sigstore provenance attestation `npm publish --provenance` emits.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # `npm publish` needs a registry-authenticated npm; Bun installs the workspace.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bun scripts/publish-npm.ts
          else
            bun scripts/publish-npm.ts --publish
          fi
