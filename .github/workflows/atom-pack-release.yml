name: Atom Pack Release

on:
  workflow_call:
    inputs:
      build_command:
        description: Command that builds the entry declared in atom-pack.json
        required: false
        type: string
        default: bun run build

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out atom pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: atom-pack

      - name: Check out Monad packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Monadix-AI/monad
          ref: main
          path: monad-tooling

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('monad-tooling/bun.lock', 'atom-pack/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Monad packaging dependencies
        working-directory: monad-tooling
        run: bun install --frozen-lockfile

      - name: Prepare isolated build workspace
        run: |
          printf '%s\n' '{"private":true,"workspaces":["atom-pack","monad-tooling/packages/*"]}' > package.json
          bun install --ignore-scripts

      - name: Build atom pack
        working-directory: atom-pack
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Generate Monad contracts
        working-directory: monad-tooling
        run: bun run generate

      - name: Create canonical artifact
        run: bun monad-tooling/apps/cli/src/main.ts atom pack atom-pack --out "$GITHUB_WORKSPACE/release/atom-pack.zip"

      - name: Publish canonical Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/atom-pack.zip
            release/atom-pack.zip.sha256
          fail_on_unmatched_files: true
