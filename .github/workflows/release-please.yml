name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

# Default GITHUB_TOKEN cannot trigger other workflows (including `on: pull_request` CI).
# RELEASE_PLEASE_TOKEN is a fine-grained PAT with Contents + Pull Requests write on this repo.
# To create one: GitHub → Settings → Developer settings → Fine-grained tokens → Generate.
# Store it as repo secret RELEASE_PLEASE_TOKEN. Falls back to GITHUB_TOKEN if absent (CI
# won't run on the release PR, but everything else still works).
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  release-assets:
    name: build and publish release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      attestations: write
      contents: write
      id-token: write
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
      make_latest: true
