name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (for example v0.2.0 or v0.2.0-beta.1).
        required: true
        type: string
      sha:
        description: Commit the release points at.
        required: true
        type: string
      make_latest:
        description: Whether publishing moves GitHub's latest stable release pointer.
        required: false
        type: boolean
        default: false
      generate_notes:
        description: Generate notes for a release without a release PR, such as nightly.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string
      sha:
        description: Commit to build. Defaults to the tag when empty.
        required: false
        type: string
      make_latest:
        description: Whether publishing moves GitHub's latest stable release pointer.
        required: false
        type: boolean
        default: false
      generate_notes:
        description: Generate notes instead of requiring a prepared draft release.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_REF: ${{ inputs.sha || inputs.tag }}
  RELEASE_TAG: ${{ inputs.tag }}
  MONAD_DIST_VERSION: ${{ inputs.tag }}

jobs:
  preflight:
    name: verify release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release version and draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(jq -er '.version' package.json)"
          [[ "${RELEASE_TAG}" == "v${version}" || "${RELEASE_TAG}" == "v${version}-"* ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "${RELEASE_REF}^{commit}")" ]]
          if [[ "${{ inputs.generate_notes }}" != true ]]; then
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft \
              --jq 'select(.isDraft == true) | true' | grep -qx true
          fi

  atom-pack:
    name: build monad power pack
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate contracts
        run: bun run generate
      - name: Build Power Pack
        run: |
          bun run --cwd packages/monad-power-pack build:atom-pack
          bun apps/cli/src/main.ts atom pack packages/monad-power-pack --out dist/monad-power-pack.atom-pack.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monad-power-pack
          path: dist/monad-power-pack.atom-pack.zip
          retention-days: 1

  build:
    name: dist build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-pc-windows-msvc
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.6.11
          install: true
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install Linux and Windows cross-compilers
        if: runner.os == 'Linux'
        run: |
          # GitHub's default azure.archive.ubuntu.com mirror stalled for tens of minutes today and
          # exhausted every bounded retry. Point apt at the canonical archive first; the retry below
          # stays as a backstop.
          sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for attempt in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update \
              && sudo timeout 420 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
                install -y --no-install-recommends binutils binutils-aarch64-linux-gnu gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-mingw-w64-x86-64 \
              && break
            echo "::warning::apt attempt ${attempt} did not finish within its deadline"
            test "${attempt}" != 3 || exit 1
          done
      - name: Install LLVM MinGW for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        env:
          LLVM_MINGW_SHA256: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda
          LLVM_MINGW_VERSION: "20260616"
        run: |
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}"
          echo "${LLVM_MINGW_SHA256}  ${archive}" | sha256sum --check
          tar -xJf "${archive}"
          toolchain_bin="${PWD}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin"
          "${toolchain_bin}/aarch64-w64-mingw32-clang" --version
          echo "${toolchain_bin}" >> "${GITHUB_PATH}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build target archive
        run: |
          dist build --artifacts=local --target=${{ matrix.target }} --tag=${{ env.RELEASE_TAG }} --force-tag --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/${{ matrix.target }}-dist-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/distrib/monad-${{ matrix.target }}.tar.gz
            target/distrib/monad-${{ matrix.target }}.tar.gz.sha256
            target/distrib/monad-${{ matrix.target }}.zip
            target/distrib/monad-${{ matrix.target }}.zip.sha256
            target/distrib/${{ matrix.target }}-dist-manifest.json
          if-no-files-found: error
          retention-days: 1

  installers:
    name: generate dist installers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.6.11
          install: true
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: target/distrib
      - name: Generate shell and PowerShell installers
        run: |
          dist build --artifacts=global --tag=${{ env.RELEASE_TAG }} --force-tag --output-format=json > dist-manifest.json
          bun scripts/enhance-dist-installers.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-installers
          path: |
            target/distrib/install.sh
            target/distrib/install.ps1
            target/distrib/sha256.sum
            target/distrib/source.tar.gz
            target/distrib/source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: [atom-pack, installers]
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.6.11
          install: true
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monad-power-pack
          path: artifacts
      - name: Stage public release assets
        run: bun scripts/stage-public-release-assets.ts --from artifacts --to release-assets
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Resolve nightly release range
        if: inputs.generate_notes
        id: release
        shell: bash
        run: |
          metadata="$(bun scripts/resolve-release-range.ts --tag "${RELEASE_TAG}" --target "${RELEASE_REF}")"
          echo "range=$(jq -er '.range' <<<"$metadata")" >> "$GITHUB_OUTPUT"
      - name: Generate nightly release notes
        if: inputs.generate_notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          version: v2.13.1
          config: cliff.toml
          args: ${{ steps.release.outputs.range }} --tag ${{ env.RELEASE_TAG }} --output release-notes.md
      - name: Create nightly draft and upload release assets
        if: inputs.generate_notes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ inputs.sha || inputs.tag }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Upload assets to prepared release draft
        if: ${{ !inputs.generate_notes }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Verify GitHub release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets)"
          local_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          remote_count="$(jq -r '.assets | length' <<<"${release}")"
          [[ "${local_count}" == "${remote_count}" ]] || {
            echo "release asset count mismatch: local=${local_count} github=${remote_count}" >&2
            exit 1
          }
          for asset in release-assets/*; do
            name="$(basename "${asset}")"
            local_digest="sha256:$(sha256sum "${asset}" | cut -d' ' -f1)"
            github_digest="$(jq -er --arg name "${name}" '.assets[] | select(.name == $name) | .digest' <<<"${release}")"
            [[ "${local_digest}" == "${github_digest}" ]] || {
              echo "release asset digest mismatch for ${name}: local=${local_digest} github=${github_digest}" >&2
              exit 1
            }
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.make_latest }}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          else
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi
