name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (for example v0.2.0 or v0.2.0-beta.1).
        required: true
        type: string
      sha:
        description: Commit the release points at.
        required: true
        type: string
      make_latest:
        description: Whether publishing moves GitHub's latest stable release pointer.
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        description: Token used to authenticate Turbo remote cache access.
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string
      sha:
        description: Commit to build. Defaults to the tag when empty.
        required: false
        type: string
      make_latest:
        description: Whether publishing moves GitHub's latest stable release pointer.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DIST_VERSION: "0.32.0"
  RELEASE_REF: ${{ inputs.sha || inputs.tag }}
  RELEASE_TAG: ${{ inputs.tag }}
  MONAD_DIST_VERSION: ${{ inputs.tag }}

jobs:
  ci-gate:
    name: validate release commit
    uses: ./.github/workflows/ci.yml
    with:
      full: true
      force: true
      sha: ${{ inputs.sha || inputs.tag }}
    secrets: inherit

  atom-pack:
    name: build monad power pack
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate contracts
        run: bun run generate
      - name: Build and verify Power Pack
        run: |
          bun run --cwd packages/monad-power-pack build:atom-pack
          bun apps/cli/src/main.ts atom pack packages/monad-power-pack --out dist/monad-power-pack.atom-pack.zip
          bun scripts/bun-test.ts packages/monad-power-pack/test/unit --only-failures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monad-power-pack
          path: dist/monad-power-pack.atom-pack.zip
          retention-days: 1

  build:
    name: dist build (${{ matrix.target }})
    needs: ci-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-pc-windows-msvc
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install Linux and Windows cross-compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils binutils-aarch64-linux-gnu gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-mingw-w64-x86-64
      - name: Install LLVM MinGW for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        env:
          LLVM_MINGW_SHA256: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda
          LLVM_MINGW_VERSION: "20260616"
        run: |
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}"
          echo "${LLVM_MINGW_SHA256}  ${archive}" | sha256sum --check
          tar -xJf "${archive}"
          toolchain_bin="${PWD}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin"
          "${toolchain_bin}/aarch64-w64-mingw32-clang" --version
          echo "${toolchain_bin}" >> "${GITHUB_PATH}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Build target archive
        run: |
          dist build --artifacts=local --target=${{ matrix.target }} --tag=${{ env.RELEASE_TAG }} --force-tag --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/${{ matrix.target }}-dist-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/distrib/monad-${{ matrix.target }}.tar.gz
            target/distrib/monad-${{ matrix.target }}.tar.gz.sha256
            target/distrib/monad-${{ matrix.target }}.zip
            target/distrib/monad-${{ matrix.target }}.zip.sha256
            target/distrib/${{ matrix.target }}-dist-manifest.json
          if-no-files-found: error
          retention-days: 1

  installers:
    name: generate dist installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: target/distrib
      - name: Generate shell and PowerShell installers
        run: |
          dist build --artifacts=global --tag=${{ env.RELEASE_TAG }} --force-tag --output-format=json > dist-manifest.json
          bun scripts/enhance-dist-installers.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-installers
          path: |
            target/distrib/install.sh
            target/distrib/install.ps1
            target/distrib/sha256.sum
            target/distrib/source.tar.gz
            target/distrib/source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  install-test:
    name: installer smoke test (${{ matrix.os }})
    needs: installers
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-14
          - os: windows
            runner: windows-latest
          - os: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: artifacts
      - name: Test shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m http.server 8123 --directory artifacts >"${RUNNER_TEMP}/monad-dist-http.log" 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8123/ >/dev/null && break; sleep 0.25; done
          export MONAD_DOWNLOAD_URL=http://127.0.0.1:8123
          export MONAD_INSTALL_DIR="${RUNNER_TEMP}/monad-install"
          export MONAD_NO_MODIFY_PATH=1
          export MONAD_NO_OPEN=1
          export MONAD_FORCE_INTERACTIVE=1
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            script -q "${RUNNER_TEMP}/install.log" sh artifacts/install.sh
          else
            script -qefc "sh artifacts/install.sh" "${RUNNER_TEMP}/install.log"
          fi
          cat "${RUNNER_TEMP}/install.log"
          grep -F "◆ MONAD" "${RUNNER_TEMP}/install.log"
          grep -F "▮" "${RUNNER_TEMP}/install.log"
          grep -F "Checksum verified" "${RUNNER_TEMP}/install.log"
          ! grep -F "no checksums to verify" "${RUNNER_TEMP}/install.log"
          ! grep -F "skipping sha256 checksum verification" "${RUNNER_TEMP}/install.log"
          test -x "${MONAD_INSTALL_DIR}/monad"
          "${MONAD_INSTALL_DIR}/monad" --version | grep -F "${MONAD_DIST_VERSION#v}"
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8123','--directory','artifacts' -WindowStyle Hidden
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            try { Invoke-WebRequest http://127.0.0.1:8123/ -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 250 }
          }
          $env:MONAD_DOWNLOAD_URL = 'http://127.0.0.1:8123'
          $env:MONAD_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'monad-install'
          $env:MONAD_NO_MODIFY_PATH = '1'
          $env:MONAD_NO_OPEN = '1'
          $env:MONAD_FORCE_INTERACTIVE = '1'
          & artifacts/install.ps1 *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'install.log')
          Select-String -SimpleMatch '◆ MONAD' (Join-Path $env:RUNNER_TEMP 'install.log') | Out-Null
          Select-String -SimpleMatch 'Checksum verified' (Join-Path $env:RUNNER_TEMP 'install.log') | Out-Null
          if (Select-String -SimpleMatch 'no checksums to verify' (Join-Path $env:RUNNER_TEMP 'install.log')) {
            throw 'installer did not verify the archive checksum'
          }
          if (!(Test-Path (Join-Path $env:MONAD_INSTALL_DIR 'monad.exe'))) { throw 'monad.exe was not installed' }
          & (Join-Path $env:MONAD_INSTALL_DIR 'monad.exe') --version | Select-String ($env:MONAD_DIST_VERSION -replace '^v','')

  upgrade-test:
    name: dist CLI and Web upgrade e2e
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Build an older managed installation
        env:
          MONAD_DIST_VERSION: 0.0.1
        run: |
          rm -rf target/distrib
          dist build --artifacts=local --target=x86_64-unknown-linux-gnu --tag=v0.0.1 --force-tag --output-format=json > old-local-dist-manifest.json
          cp old-local-dist-manifest.json target/distrib/x86_64-unknown-linux-gnu-dist-manifest.json
          dist build --artifacts=global --tag=v0.0.1 --force-tag --output-format=json > old-global-dist-manifest.json
          bun scripts/enhance-dist-installers.ts
          mkdir -p artifacts/old
          find target/distrib -maxdepth 1 -type f -exec cp {} artifacts/old/ \;
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: artifacts/new
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-installers
          path: artifacts/new
      - name: Upgrade an active daemon through CLI and Web
        run: |
          CHANNEL=stable
          case "${RELEASE_TAG}" in
            *-beta.*) CHANNEL=beta ;;
            *-nightly.*) CHANNEL=nightly ;;
          esac
          bun scripts/test/upgrade-dist-e2e.ts \
            --old-dir artifacts/old \
            --new-dir artifacts/new \
            --tag "${RELEASE_TAG}" \
            --channel "${CHANNEL}"

  publish:
    name: publish GitHub release
    needs: [atom-pack, install-test, upgrade-test]
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monad-power-pack
          path: artifacts
      - name: Stage public release assets
        run: bun scripts/stage-public-release-assets.ts --from artifacts --to release-assets
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Generate complete release changelog
        run: |
          bun scripts/generate-release-changelog.ts \
            --tag "${RELEASE_TAG}" \
            --target "${RELEASE_REF}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output release-notes.md
      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ inputs.sha || inputs.tag }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Verify GitHub release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets)"
          local_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          remote_count="$(jq -r '.assets | length' <<<"${release}")"
          [[ "${local_count}" == "${remote_count}" ]] || {
            echo "release asset count mismatch: local=${local_count} github=${remote_count}" >&2
            exit 1
          }
          for asset in release-assets/*; do
            name="$(basename "${asset}")"
            local_digest="sha256:$(sha256sum "${asset}" | cut -d' ' -f1)"
            github_digest="$(jq -er --arg name "${name}" '.assets[] | select(.name == $name) | .digest' <<<"${release}")"
            [[ "${local_digest}" == "${github_digest}" ]] || {
              echo "release asset digest mismatch for ${name}: local=${local_digest} github=${github_digest}" >&2
              exit 1
            }
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.make_latest }}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          else
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi
