StylesPath = styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure
Vocab = Monad

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale
Vale.Terms = NO
TokenIgnores = (?sm)((?:import|export) .+?$), (?<!`)(<\w+ ?.+ ?\/>)(?!`), (<[A-Z]\w+>.+?<\/[A-Z]\w+>), \{[^}]*\}
