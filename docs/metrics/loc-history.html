<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Monad LOC Daily Report</title>
  <style>
    :root {
      --accent: #74e0c0;
      --bg: #0b0f14;
      --line: #263445;
      --muted: #93a4b8;
      --panel: #111821;
      --panel-2: #17212d;
      --text: #edf4ff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #18314b 0, transparent 32rem),
        linear-gradient(135deg, #081018 0%, var(--bg) 52%, #10151d 100%);
    }
    main { width: min(1180px, calc(100vw - 40px)); padding: 48px 0; margin: 0 auto; }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: end;
      margin-bottom: 30px;
    }
    h1 { max-width: 720px; margin: 0; font-size: clamp(36px, 6vw, 78px); line-height: .92; }
    .lede { max-width: 680px; margin: 18px 0 0; font-size: 16px; line-height: 1.7; color: var(--muted); }
    .stamp { font-size: 13px; line-height: 1.7; color: var(--muted); text-align: right; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .metric, .chart, .table-wrap, .error {
      background: linear-gradient(180deg, color-mix(in srgb, var(--panel), transparent 2%), color-mix(in srgb, var(--panel-2), transparent 18%));
      border: 1px solid color-mix(in srgb, var(--line), transparent 20%);
      border-radius: 8px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .28);
    }
    .metric { min-height: 128px; padding: 18px; }
    .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .value { margin-top: 16px; font-size: clamp(26px, 4vw, 44px); font-weight: 760; line-height: 1; }
    .sub { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .chart { padding: 20px; margin-bottom: 16px; overflow: hidden; }
    .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    h2 { margin: 0; font-size: 18px; }
    svg { display: block; width: 100%; height: auto; }
    .axis { stroke: #2b3949; stroke-width: 1; }
    .tick { stroke: #223041; stroke-width: 1; }
    .axis-text { font-size: 12px; fill: var(--muted); }
    .axis-title { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; fill: #c5d5e8; }
    .area { opacity: .85; fill: url(#area); }
    .line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .point { fill: var(--accent); }
    .table-wrap { overflow: hidden; }
    table { width: 100%; font-size: 13px; border-collapse: collapse; }
    th, td { padding: 12px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      background: rgba(255, 255, 255, .03);
    }
    td:nth-child(2), td:nth-child(3) { font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    .error { padding: 20px; line-height: 1.6; color: #f8c46c; }
    [hidden] { display: none; }
    @media (max-width: 860px) {
      main { width: min(100vw - 28px, 680px); padding: 28px 0; }
      header { grid-template-columns: 1fr; }
      .stamp { text-align: left; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .table-wrap { overflow-x: auto; }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 42px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Monad LOC Daily Report</h1>
        <p class="lede">Daily TypeScript line and file counts, loaded directly from <code>loc-history.csv</code>.</p>
      </div>
      <div class="stamp"><span id="latest">Loading CSV…</span><br>Refreshes every 30 seconds</div>
    </header>
    <div class="error" hidden id="error" ></div>
    <div hidden id="report" >
      <section class="grid">
        <div class="metric"><div class="label">Latest lines</div><div class="value" id="latest-lines"></div><div class="sub">TypeScript LOC</div></div>
        <div class="metric"><div class="label">Latest files</div><div class="value" id="latest-files"></div><div class="sub">TS/TSX files counted</div></div>
        <div class="metric"><div class="label">Growth</div><div class="value" id="growth"></div><div class="sub" id="growth-range"></div></div>
        <div class="metric"><div class="label">Rows</div><div class="value" id="row-count"></div><div class="sub">Daily snapshots</div></div>
      </section>
      <section class="chart">
        <div class="chart-head"><h2>Lines by day</h2></div>
        <svg aria-label="Daily LOC chart" id="chart" role="img" viewBox="0 0 1120 430"></svg>
      </section>
      <section class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Lines</th><th>Files</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </div>
  </main>
  <script>
    const fmt = new Intl.NumberFormat();
    const elements = {
      chart: document.getElementById('chart'),
      error: document.getElementById('error'),
      growth: document.getElementById('growth'),
      growthRange: document.getElementById('growth-range'),
      latest: document.getElementById('latest'),
      latestFiles: document.getElementById('latest-files'),
      latestLines: document.getElementById('latest-lines'),
      report: document.getElementById('report'),
      rowCount: document.getElementById('row-count'),
      rows: document.getElementById('rows')
    };

    async function loadReport() {
      try {
        const response = await fetch(`./loc-history.csv?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`CSV request failed with ${response.status}`);
        const rows = parseCsv(await response.text());
        if (rows.length === 0) throw new Error('CSV contains no data rows');
        render(rows);
        elements.error.hidden = true;
        elements.report.hidden = false;
      } catch (error) {
        elements.report.hidden = true;
        elements.error.hidden = false;
        elements.error.textContent = location.protocol === 'file:'
          ? 'Dynamic CSV loading requires HTTP. Serve docs/metrics locally, then open this report through http://localhost.'
          : `Unable to load loc-history.csv: ${error instanceof Error ? error.message : String(error)}`;
      }
    }

    function parseCsv(csv) {
      const [header, ...lines] = csv.trim().split(/\r?\n/);
      if (header !== 'date,lines,files') throw new Error('CSV header must be date,lines,files');
      return lines.map((line) => {
        const [date, linesValue, filesValue] = line.split(',');
        const lines = Number(linesValue);
        const files = Number(filesValue);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(lines) || !Number.isFinite(files)) {
          throw new Error(`Invalid CSV row: ${line}`);
        }
        return { date, files, lines };
      });
    }

    function render(rows) {
      const first = rows[0];
      const latest = rows.at(-1);
      const growth = first.lines === 0 ? 0 : ((latest.lines - first.lines) / first.lines) * 100;
      elements.latest.textContent = `Latest row ${latest.date}`;
      elements.latestLines.textContent = fmt.format(latest.lines);
      elements.latestFiles.textContent = fmt.format(latest.files);
      elements.growth.textContent = `${Math.round(growth)}%`;
      elements.growthRange.textContent = `${first.date} to ${latest.date}`;
      elements.rowCount.textContent = fmt.format(rows.length);
      renderChart(rows);
      renderTable(rows);
    }

    function renderChart(rows) {
      const width = 1120;
      const height = 430;
      const pad = { left: 82, right: 28, top: 24, bottom: 62 };
      const max = Math.max(...rows.map((row) => row.lines), 1);
      const min = Math.min(...rows.map((row) => row.lines), 0);
      const span = Math.max(1, max - min);
      const x = (index) => pad.left + (index / Math.max(1, rows.length - 1)) * (width - pad.left - pad.right);
      const y = (value) => pad.top + (1 - (value - min) / span) * (height - pad.top - pad.bottom);
      const points = rows.map((row, index) => [x(index), y(row.lines)]);
      const line = points.map(([px, py], index) => `${index === 0 ? 'M' : 'L'}${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
      const area = `${line} L${x(rows.length - 1).toFixed(1)},${height - pad.bottom} L${pad.left},${height - pad.bottom} Z`;
      const xTickIndexes = Array.from(new Set([
        0,
        Math.round((rows.length - 1) * .25),
        Math.round((rows.length - 1) * .5),
        Math.round((rows.length - 1) * .75),
        rows.length - 1
      ])).filter((index) => rows[index]);
      const yTicks = Array.from({ length: 4 }, (_, index) => Math.round(min + (span * index) / 3));
      elements.chart.innerHTML = `
        <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#74e0c0" stop-opacity=".35"/><stop offset="100%" stop-color="#74e0c0" stop-opacity="0"/></linearGradient></defs>
        ${yTicks.map((tick) => `<line class="tick" x1="${pad.left}" y1="${y(tick).toFixed(1)}" x2="${width - pad.right}" y2="${y(tick).toFixed(1)}"></line><text class="axis-text" x="${pad.left - 12}" y="${y(tick).toFixed(1)}" text-anchor="end" dominant-baseline="middle">${fmt.format(tick)}</text>`).join('')}
        ${xTickIndexes.map((index) => `<line class="tick" x1="${x(index).toFixed(1)}" y1="${height - pad.bottom}" x2="${x(index).toFixed(1)}" y2="${height - pad.bottom + 6}"></line><text class="axis-text" x="${x(index).toFixed(1)}" y="${height - pad.bottom + 24}" text-anchor="middle">${rows[index].date.slice(5)}</text>`).join('')}
        <line class="axis" x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}"></line>
        <line class="axis" x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}"></line>
        <path class="area" d="${area}"></path>
        <path class="line" d="${line}"></path>
        ${rows.map((row, index) => `<circle class="point" cx="${x(index).toFixed(1)}" cy="${y(row.lines).toFixed(1)}" r="4"><title>${row.date}: ${fmt.format(row.lines)} lines</title></circle>`).join('')}
        <text class="axis-title" x="${(pad.left + width - pad.right) / 2}" y="${height - 10}" text-anchor="middle">Date</text>
        <text class="axis-title" x="18" y="${(pad.top + height - pad.bottom) / 2}" text-anchor="middle" transform="rotate(-90 18 ${(pad.top + height - pad.bottom) / 2})">Lines of code</text>
      `;
    }

    function renderTable(rows) {
      elements.rows.replaceChildren(...rows.toReversed().map((row) => {
        const tr = document.createElement('tr');
        for (const value of [row.date, fmt.format(row.lines), fmt.format(row.files)]) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.append(td);
        }
        return tr;
      }));
    }

    loadReport();
    setInterval(loadReport, 30_000);
  </script>
</body>
</html>
