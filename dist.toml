[package]
name = "monad"
version = "0.1.5"
description = "Daemon-first agent team runtime with headless architecture."
homepage = "https://monadix.ai"
license = "Apache-2.0"
repository = "https://github.com/Monadix-AI/monad"
binaries = ["monad"]
out-dir = "out"
build-command = ["bun", "scripts/build-dist.ts"]

[dist]
include = ["out/assets", "out/helpers"]

[dist.binaries]
aarch64-unknown-linux-gnu = ["monad", "monad-sandbox-launcher"]
x86_64-unknown-linux-gnu = ["monad", "monad-sandbox-launcher"]
aarch64-unknown-linux-musl = ["monad", "monad-sandbox-launcher"]
x86_64-unknown-linux-musl = ["monad", "monad-sandbox-launcher"]
aarch64-pc-windows-msvc = [
  "monad",
  "monad-sandbox-launcher",
  "monad-sandbox-appcontainer",
  "monad-shortcut-aumid",
]
x86_64-pc-windows-msvc = [
  "monad",
  "monad-sandbox-launcher",
  "monad-sandbox-appcontainer",
  "monad-shortcut-aumid",
]
